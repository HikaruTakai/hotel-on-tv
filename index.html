<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090d13">
<title>Hotel on TV</title>
<style>
:root{color-scheme:dark;--fg:#f6f3ec;--muted:rgba(246,243,236,.68);--glass:rgba(20,24,29,.38);--line:rgba(255,255,255,.19);--gold:#d9c29a;--safe:5.1vw}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#090d13;color:var(--fg);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
button,input{font:inherit}button{color:inherit}#backdrop{position:fixed;inset:0;z-index:-5;background:#101821 center/cover no-repeat;transform:none;transition:none}#backdrop:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,9,13,.77) 0%,rgba(5,9,13,.44) 47%,rgba(5,9,13,.16) 100%),linear-gradient(0deg,rgba(4,7,10,.7),transparent 40%,rgba(4,7,10,.23));}#backdrop:after{content:none}
#grain{display:none}
#shade{position:fixed;inset:0;z-index:0;background:rgba(0,0,0,0);pointer-events:none;transition:background .8s}body.sleep #shade{background:rgba(0,0,0,.48)}
#frame{position:fixed;inset:0;z-index:10;pointer-events:none}#frame svg{width:100%;height:100%;overflow:visible}#frame .track{fill:none;stroke:rgba(255,255,255,.15);stroke-width:1.15}#frame .hand{fill:none;stroke:rgba(239,220,184,.98);stroke-width:2.1;stroke-linecap:round;stroke-dasharray:34 9999;filter:none}
#layout{position:relative;z-index:1;height:100%;padding:5.2vh var(--safe) 4.2vh;display:grid;grid-template-rows:auto 1fr auto;gap:2vh}.top{display:flex;align-items:flex-start;justify-content:space-between}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:34px;height:34px;border:1px solid rgba(233,215,180,.55);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-family:Georgia,serif;font-size:17px}.brand-name{font-size:11px;letter-spacing:.32em;font-weight:600}.brand-caption{font-size:9px;letter-spacing:.24em;color:var(--muted);margin-top:5px}.time{text-align:right}.time-main{font-size:clamp(36px,4.3vw,64px);font-weight:250;letter-spacing:.035em;line-height:1}.time-date{font-size:11px;letter-spacing:.13em;color:var(--muted);margin-top:9px}
.middle{display:flex;align-items:center;min-height:0}.welcome{max-width:660px;padding:0 0 1vh 1.2vw}.eyebrow{font-size:10px;letter-spacing:.34em;color:var(--gold);margin-bottom:23px}.headline{white-space:pre-line;font-family:"Hiragino Mincho ProN",YuMincho,"Noto Serif JP",serif;font-size:clamp(35px,5vw,72px);font-weight:400;letter-spacing:.06em;line-height:1.48;margin:0;text-shadow:0 3px 28px rgba(0,0,0,.28)}.subline{font-size:clamp(12px,1.1vw,15px);letter-spacing:.12em;color:rgba(246,243,236,.74);margin-top:19px;font-weight:300}.rule{width:62px;height:1px;background:var(--gold);opacity:.85;margin-top:31px}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.dock{display:flex;gap:10px;align-items:center;min-width:0}.app{width:clamp(112px,11vw,154px);height:62px;border:1px solid rgba(255,255,255,.2);border-radius:16px;background:rgba(16,20,24,.34);display:flex;align-items:center;gap:11px;padding:0 13px;text-align:left;cursor:pointer;transition:background .25s,border .25s,transform .25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}.app:focus-visible,.app.focused,.utility:focus-visible,.utility.focused,.scene-choice:focus-visible{outline:2px solid rgba(235,214,177,.9);outline-offset:3px;background:rgba(255,255,255,.16);transform:translateY(-3px)}.app-symbol{width:33px;height:33px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:16px;font-weight:700;flex:none}.app-name{font-size:12px;font-weight:600;letter-spacing:.01em}.utilities{display:flex;gap:9px;align-items:center;flex:none}.utility{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(18,22,26,.72);display:grid;place-items:center;cursor:pointer;font-size:16px;color:rgba(255,255,255,.86)}.hint{position:absolute;right:var(--safe);bottom:1.4vh;font-size:8px;letter-spacing:.22em;color:rgba(255,255,255,.42)}
#panel{position:fixed;z-index:30;right:4vw;top:50%;transform:translate(20px,-50%);width:min(440px,88vw);max-height:82vh;overflow:auto;padding:24px;border:1px solid rgba(255,255,255,.2);border-radius:24px;background:rgba(13,17,22,.86);box-shadow:0 24px 90px #0008;opacity:0;visibility:hidden;transition:.25s}#panel.open{opacity:1;visibility:visible;transform:translate(0,-50%)}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.panel-title{font-family:YuMincho,serif;font-size:23px;font-weight:400;letter-spacing:.08em}.close{width:36px;height:36px;border-radius:50%;border:1px solid #ffffff33;background:#ffffff12;font-size:18px}.section-label{font-size:9px;letter-spacing:.24em;color:var(--gold);margin:20px 0 10px}.scene-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.scene-choice{height:76px;border:1px solid #ffffff25;border-radius:13px;background-size:cover;background-position:center;text-align:left;padding:12px;display:flex;align-items:flex-end;font-size:12px;letter-spacing:.1em;cursor:pointer;text-shadow:0 2px 8px #000}.scene-choice[aria-pressed=true]{border:1px solid var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff18;font-size:12px;color:#eee}.setting-row input{width:58%;border:1px solid #ffffff30;border-radius:9px;background:#ffffff12;color:white;padding:9px;outline:none}.setting-row input:focus{border-color:var(--gold)}.panel-action{width:100%;margin-top:14px;border:1px solid #ffffff30;background:#ffffff12;border-radius:12px;padding:12px;font-size:12px;letter-spacing:.08em}.panel-note{font-size:10px;line-height:1.7;color:#ffffff80;margin-top:14px}
#idle{position:fixed;inset:0;z-index:25;background:rgba(5,8,12,.94);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity 1.2s}#idle.show{opacity:1;visibility:visible}#idle .idle-time{font-size:clamp(56px,9vw,120px);font-weight:200;letter-spacing:.04em}#idle .idle-date{font-size:12px;letter-spacing:.2em;color:#a9a39a;text-align:center;margin-top:16px}#toast{position:fixed;z-index:50;left:50%;bottom:9vh;transform:translate(-50%,12px);padding:11px 18px;border-radius:30px;background:rgba(12,16,20,.86);border:1px solid #ffffff25;color:white;font-size:12px;opacity:0;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){:root{--safe:4vw}#layout{padding:4vh var(--safe) 3vh}.middle{align-items:center}.welcome{padding-left:0}.bottom{align-items:flex-end}.dock{gap:7px;flex-wrap:wrap}.app{width:calc(25% - 6px);min-width:100px;height:55px;padding:0 9px}.utilities{gap:6px}.utility{width:40px;height:40px}}
@media(max-height:600px){#layout{padding-top:3vh;padding-bottom:2vh}.headline{font-size:clamp(30px,4vw,54px)}.bottom .app{height:52px}.brand-mark{width:29px;height:29px}}
</style>
</head>
<body>
<div id="backdrop"></div><div id="grain"></div><div id="shade"></div>
<div id="frame" aria-hidden="true"><svg viewBox="0 0 1000 562.5" preserveAspectRatio="none"><rect class="track" x="13" y="13" width="974" height="536" rx="13"/><rect class="hand" id="secondHand" x="13" y="13" width="974" height="536" rx="13"/></svg></div>
<div id="layout">
 <header class="top"><div class="brand"><div class="brand-mark">H</div><div><div class="brand-name">HOTEL ON TV</div><div class="brand-caption">A QUIETER KIND OF LUXURY</div></div></div><div class="time"><div class="time-main" id="clock">--:--</div><div class="time-date" id="date">----</div></div></header>
 <main class="middle"><section class="welcome"><div class="eyebrow" id="greeting">WELCOME HOME</div><h1 class="headline" id="headline">いつもの部屋に、<br>上質なくつろぎを。</h1><div class="subline" id="subline">今日も一日、おつかれさまでした。</div><div class="rule"></div></section></main>
 <footer class="bottom"><nav class="dock" id="dock" aria-label="アプリ"></nav><div class="utilities"><button class="utility" id="sceneButton" aria-label="シーン" title="シーン">◒</button><button class="utility" id="sleepButton" aria-label="おやすみモード" title="おやすみモード">☾</button><button class="utility" id="settingsButton" aria-label="設定" title="設定">⚙</button></div></footer>
</div>
<div id="panel" role="dialog" aria-modal="true" aria-label="設定"><div class="panel-head"><div class="panel-title" id="panelTitle">シーンを選ぶ</div><button class="close" id="closePanel" aria-label="閉じる">×</button></div><div id="sceneSettings"><div class="section-label">AMBIENCE</div><div class="scene-grid" id="sceneGrid"></div><div class="section-label">CUSTOM WALLPAPER</div><div class="setting-row"><span>画像URL</span><input id="wallUrl" type="url" placeholder="https://..." /></div><button class="panel-action" id="applyWall">この画像を背景にする</button></div><div id="generalSettings" hidden><div class="section-label">PERSONAL TOUCH</div><label class="setting-row"><span>表示するメッセージ</span><input id="messageInput" maxlength="42" value="いつもの部屋に、上質なくつろぎを。"></label><label class="setting-row"><span>サブメッセージ</span><input id="subInput" maxlength="50" value="今日も一日、おつかれさまでした。"></label><div class="section-label">DISPLAY</div><label class="setting-row"><span>画面を暗くするまで</span><input id="idleInput" type="number" min="0" max="240" value="0" /></label><button class="panel-action" id="saveSettings">保存する</button><button class="panel-action" id="resetSettings">初期状態に戻す</button><div class="panel-note">画面の操作がない状態が続くと、時計だけの静かな表示に切り替わります。0分で無効です。</div></div></div>
<div id="idle"><div><div class="idle-time" id="idleTime">00:00</div><div class="idle-date" id="idleDate"></div></div></div><div id="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const scenes=[
 {name:'都会の夜景',url:'https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=1600&q=65',fallback:'linear-gradient(125deg,#101b2a,#384b5b 48%,#111827)'},
 {name:'静かな海辺',url:'https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1600&q=65',fallback:'linear-gradient(125deg,#102c3d,#426d7b 48%,#101c2a)'},
 {name:'森のリトリート',url:'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1600&q=65',fallback:'linear-gradient(125deg,#101d19,#3b5944 48%,#101b18)'},
 {name:'山の静寂',url:'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=65',fallback:'linear-gradient(125deg,#101923,#4a5b69 48%,#111820)'},
 {name:'月夜',url:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1600&q=65',fallback:'linear-gradient(125deg,#080d19,#28344e 48%,#090d17)'},
 {name:'雪景色',url:'https://images.unsplash.com/photo-1517299321609-52687d1bc55a?auto=format&fit=crop&w=1600&q=65',fallback:'linear-gradient(125deg,#273442,#71808a 48%,#17222e)'}
];
const apps=[
 {name:'Prime Video',symbol:'▶',url:'https://www.primevideo.com'},
 {name:'YouTube',symbol:'▶',url:'https://www.youtube.com/tv'},
 {name:'Netflix',symbol:'N',url:'https://www.netflix.com'},
 {name:'TVer',symbol:'T',url:'https://tver.jp'},
 {name:'ABEMA',symbol:'A',url:'https://abema.tv'},
 {name:'Spotify',symbol:'♫',url:'https://open.spotify.com'}
];
const defaults={scene:0,wallUrl:'',message:'いつもの部屋に、\n上質なくつろぎを。',sub:'今日も一日、おつかれさまでした。',idle:0,sleep:false};
let state={...defaults,...read('hotv_atmosphere',{})},lastInput=Date.now(),focusables=[],focusIndex=0,scenesRendered=false;
function read(k,d){try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(){try{localStorage.setItem('hotv_atmosphere',JSON.stringify(state))}catch(e){}}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
function setScene(i){state.scene=i;state.wallUrl='';const sc=scenes[i]||scenes[0];$('#backdrop').style.backgroundImage=`url("${sc.url}"),${sc.fallback}`;save()}
function setCustomWall(url){state.wallUrl=url;$('#backdrop').style.backgroundImage=`url("${url}"),linear-gradient(125deg,#101b2a,#384b5b)`;save()}
function renderScenes(){if(scenesRendered)return;scenesRendered=true;let g=$('#sceneGrid');g.innerHTML='';scenes.forEach((s,i)=>{let b=document.createElement('button');b.className='scene-choice';b.textContent=s.name;b.style.backgroundImage=`linear-gradient(0deg,#0009,transparent 70%),url("${s.url.replace(/w=1600&q=65/,"w=420&q=45")}")`;b.setAttribute('aria-pressed',String(!state.wallUrl&&state.scene===i));b.onclick=()=>{setScene(i);toast('シーンを切り替えました')};g.append(b)})}
function renderApps(){let d=$('#dock');d.innerHTML='';apps.forEach(a=>{let b=document.createElement('button');b.className='app';b.innerHTML=`<span class="app-symbol">${a.symbol}</span><span class="app-name">${a.name}</span>`;b.onclick=()=>{lastInput=Date.now();window.open(a.url,'_blank','noopener');};d.append(b)})}
function greeting(d){let h=d.getHours();if(h<5)return ['GOOD NIGHT','夜の静けさを、ゆっくりと。'];if(h<11)return ['GOOD MORNING','穏やかな一日のはじまりに。'];if(h<17)return ['GOOD AFTERNOON','ひと息ついて、心地よい時間を。'];if(h<22)return ['GOOD EVENING','今日も一日、おつかれさまでした。'];return ['GOOD NIGHT','夜の静けさを、ゆっくりと。']}
const hand=$('#secondHand');
let handLength=0,lastClockSecond=-1;
function updateClockText(d){
 const time=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',hour12:false});
 const date=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
 $('#clock').textContent=time;$('#date').textContent=date;$('#idleTime').textContent=time;$('#idleDate').textContent=date;
 const g=greeting(d);$('#greeting').textContent=g[0];if(!state.sub)$('#subline').textContent=g[1];
}
function animateFrame(){
 const d=new Date();
 if(d.getSeconds()!==lastClockSecond){lastClockSecond=d.getSeconds();updateClockText(d)}
 // A closed SVG rectangle has a continuous perimeter. A full-length dash pattern
 // keeps the short luminous segment moving seamlessly across the top-left seam.
 {
  if(!handLength)handLength=hand.getTotalLength();
  const progress=(d.getSeconds()+d.getMilliseconds()/1000)/60;
  const segment=34;
  hand.style.strokeDasharray=`${segment} ${Math.max(0.01,handLength-segment)}`;
  hand.style.strokeDashoffset=String(-handLength*progress);
}
}
function openPanel(which){if(which==='scene')renderScenes();$('#panel').classList.add('open');$('#sceneSettings').hidden=which!=='scene';$('#generalSettings').hidden=which!=='settings';$('#panelTitle').textContent=which==='scene'?'シーンを選ぶ':'表示設定';refreshFocus()}
function closePanel(){ $('#panel').classList.remove('open');refreshFocus() }
function refreshFocus(){focusables=$$('button:not(:disabled),input').filter(e=>e.offsetParent!==null&&!e.closest('[hidden]'));focusables.forEach((e,i)=>e.classList.toggle('focused',i===focusIndex));if(focusIndex>=focusables.length)focusIndex=0}
function moveFocus(key){refreshFocus();let cur=focusables[focusIndex];if(!cur)return;let r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let cand=focusables.map((el,i)=>{let q=el.getBoundingClientRect();return{el,i,x:q.left+q.width/2,y:q.top+q.height/2}}).filter(o=>o.el!==cur&&(key==='ArrowRight'?o.x>cx+2:key==='ArrowLeft'?o.x<cx-2:key==='ArrowDown'?o.y>cy+2:o.y<cy-2));cand.sort((a,b)=>{let score=o=>Math.hypot(o.x-cx,o.y-cy)+(key==='ArrowRight'||key==='ArrowLeft'?Math.abs(o.y-cy)*1.6:Math.abs(o.x-cx)*1.6);return score(a)-score(b)});if(cand[0]){focusIndex=cand[0].i;refreshFocus();focusables[focusIndex].scrollIntoView({block:'nearest',inline:'nearest'})}}
function activity(){lastInput=Date.now();$('#idle').classList.remove('show')}
document.addEventListener('pointerdown',activity,{passive:true});document.addEventListener('keydown',e=>{activity();if(e.key==='Escape'||e.key==='Backspace'){if($('#panel').classList.contains('open'))closePanel();else if(state.sleep){state.sleep=false;document.body.classList.remove('sleep');save()}e.preventDefault();return}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();moveFocus(e.key)}else if(e.key==='Enter'){let el=focusables[focusIndex];if(el)el.click();e.preventDefault()}});
$('#sceneButton').onclick=()=>openPanel('scene');$('#settingsButton').onclick=()=>openPanel('settings');$('#closePanel').onclick=closePanel;
$('#sleepButton').onclick=()=>{state.sleep=!state.sleep;document.body.classList.toggle('sleep',state.sleep);$('#sleepButton').textContent=state.sleep?'☼':'☾';save();toast(state.sleep?'おやすみモード':'通常表示')};
$('#applyWall').onclick=()=>{let u=$('#wallUrl').value.trim();try{let url=new URL(u);if(!/^https?:$/.test(url.protocol))throw Error();let im=new Image();im.onload=()=>{setCustomWall(u);toast('背景を変更しました')};im.onerror=()=>toast('画像を読み込めませんでした');im.src=u}catch(e){toast('画像URLを確認してください')}};
$('#saveSettings').onclick=()=>{let msg=$('#messageInput').value.trim(),sub=$('#subInput').value.trim(),idle=Number($('#idleInput').value);state.message=msg||defaults.message;state.sub=sub;state.idle=Math.max(0,Math.min(240,idle||0));$('#headline').textContent=state.message;$('#subline').textContent=state.sub||greeting(new Date())[1];save();closePanel();toast('設定を保存しました')};
$('#resetSettings').onclick=()=>{state={...defaults};$('#messageInput').value=state.message;$('#subInput').value=state.sub;$('#idleInput').value=state.idle;$('#headline').textContent=state.message;$('#subline').textContent=state.sub;setScene(0);save();toast('初期状態に戻しました')};
function init(){renderApps();$('#messageInput').value=state.message;$('#subInput').value=state.sub;$('#idleInput').value=state.idle;$('#headline').textContent=state.message;$('#subline').textContent=state.sub||greeting(new Date())[1];if(state.wallUrl){$('#backdrop').style.backgroundImage=`url("${state.wallUrl}"),linear-gradient(125deg,#101b2a,#384b5b)`;$('#wallUrl').value=state.wallUrl}else setScene(state.scene||0);document.body.classList.toggle('sleep',!!state.sleep);$('#sleepButton').textContent=state.sleep?'☼':'☾';updateClockText(new Date());setInterval(animateFrame,50);setInterval(()=>{if(state.idle>0&&Date.now()-lastInput>state.idle*60000&&!$('#panel').classList.contains('open'))$('#idle').classList.add('show')},15000);setTimeout(refreshFocus,300)}
init();
})();
</script>
</body></html>
