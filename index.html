<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="color-scheme" content="dark">
<title>Hotel on TV</title>
<style>
:root{--bg:#101827;--fg:#fff;--muted:rgba(255,255,255,.7);--line:rgba(255,255,255,.16);--panel:rgba(9,16,29,.72);--accent:#d8b477;--shadow:0 22px 70px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#101827;color:var(--fg)}
body{overflow-x:hidden}button,input{font:inherit}button{color:inherit}.app{min-height:100vh;position:relative;isolation:isolate;background-color:var(--bg);background-image:var(--wallpaper,linear-gradient(135deg,#152238,#0c111c));background-size:cover;background-position:center;transition:background-image .35s ease}.app:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.22) 45%,rgba(0,0,0,.62));pointer-events:none}.app:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 25%,transparent 0,rgba(0,0,0,.28) 90%);pointer-events:none}
.topbar{height:72px;padding:18px 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;letter-spacing:.16em;font-size:12px;font-weight:700}.brand-mark{width:30px;height:30px;border:1px solid rgba(255,255,255,.65);border-radius:50%;display:grid;place-items:center;font-size:12px}.top-actions{display:flex;gap:8px}.icon-btn,.pill-btn{border:1px solid var(--line);background:rgba(0,0,0,.16);border-radius:999px;padding:8px 13px;cursor:pointer;transition:.2s ease;backdrop-filter:blur(8px)}.icon-btn{width:38px;height:38px;padding:0;font-size:17px}.icon-btn:hover,.pill-btn:hover,.icon-btn:focus-visible,.pill-btn:focus-visible{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.5);outline:none}
.hero{width:min(1100px,90vw);margin:4vh auto 0;display:grid;grid-template-columns:1fr 310px;align-items:center;gap:8vw;min-height:48vh}.copy{max-width:620px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.25em;text-transform:uppercase;margin:0 0 18px}.headline{font-size:clamp(36px,6vw,76px);line-height:1.05;margin:0 0 18px;letter-spacing:.02em;font-weight:400}.subtitle{font-size:clamp(14px,1.7vw,19px);line-height:1.9;color:var(--muted);margin:0;max-width:560px}.clock-wrap{display:grid;place-items:center}.clock{width:min(300px,64vw);aspect-ratio:1;border:1px solid rgba(255,255,255,.4);border-radius:50%;position:relative;background:rgba(9,16,29,.24);box-shadow:var(--shadow),inset 0 0 55px rgba(0,0,0,.2)}.clock:before{content:"";position:absolute;inset:8%;border:1px solid rgba(255,255,255,.12);border-radius:50%}.tick{position:absolute;left:50%;top:5%;height:7%;width:1px;background:rgba(255,255,255,.8);transform-origin:50% 100%;opacity:.85}.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:4px;transform:translateX(-50%) rotate(0deg)}.hour{height:25%;width:5px;background:#fff}.minute{height:35%;width:3px;background:#fff}.second{height:39%;width:1px;background:var(--accent)}.center{position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%);background:var(--accent);border-radius:50%;z-index:2}.clock-text{position:absolute;left:0;right:0;bottom:20%;text-align:center}.time{font-size:27px;letter-spacing:.1em}.date{font-size:11px;color:var(--muted);margin-top:5px}
.bottom{width:min(1100px,90vw);margin:2vh auto 5vh;display:flex;justify-content:space-between;align-items:end;gap:20px}.hint{font-size:12px;color:var(--muted);line-height:1.7}.dock{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.dock button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 13px;cursor:pointer;font-size:12px;transition:.2s}.dock button:hover,.dock button:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}.sleep{position:fixed;inset:0;z-index:10;background:#02040a;display:none;place-items:center;color:rgba(255,255,255,.7);letter-spacing:.2em;font-size:12px}.sleep.show{display:grid}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.panel{width:min(570px,100%);max-height:90vh;overflow:auto;background:#111b2c;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.panel h2{font-size:19px;font-weight:500;margin:0}.close{border:0;background:transparent;color:var(--muted);font-size:24px;cursor:pointer}.form-row{margin:0 0 18px}.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.form-row input{width:100%;border:1px solid var(--line);border-radius:9px;background:#0b1321;color:#fff;padding:11px 12px;outline:none}.form-row input:focus{border-color:var(--accent)}.wallpapers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.wallpaper{aspect-ratio:1.5;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--w);position:relative;overflow:hidden}.wallpaper.selected{outline:2px solid var(--accent);outline-offset:2px}.wallpaper span{position:absolute;left:5px;bottom:4px;font-size:9px;text-shadow:0 1px 3px #000}.panel-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.save{border:0;border-radius:9px;background:var(--accent);color:#17120b;padding:10px 18px;cursor:pointer}.secondary{border:1px solid var(--line);border-radius:9px;background:transparent;padding:10px 15px;cursor:pointer}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#fff;color:#111;padding:10px 15px;border-radius:9px;font-size:12px;transition:.25s;z-index:40}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.topbar{height:62px;padding:14px 5vw}.hero{grid-template-columns:1fr;margin-top:4vh;gap:28px;text-align:center}.copy{margin:auto}.subtitle{margin:auto}.clock{width:min(240px,58vw)}.bottom{align-items:center;flex-direction:column;margin-top:4vh}.dock{justify-content:center}.hint{text-align:center}.wallpapers{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app" id="app">
<header class="topbar"><div class="brand"><span class="brand-mark">H</span><span>HOTEL ON TV</span></div><div class="top-actions"><button class="icon-btn" id="settingsBtn" aria-label="設定">⚙</button><button class="pill-btn" id="sleepBtn">休止</button></div></header>
<section class="hero"><div class="copy"><p class="eyebrow" id="eyebrow">WELCOME TO YOUR ROOM</p><h1 class="headline" id="headline">ゆっくりと、<br>お過ごしください。</h1><p class="subtitle" id="subtitle">今日という一日の余白を、あなたのために。テレビでもスマートフォンでも、心地よい時間をお楽しみください。</p></div><div class="clock-wrap"><div class="clock" id="clock" aria-label="現在時刻"><i class="tick" style="transform:translateX(-50%) rotate(0deg)"></i><i class="tick" style="transform:translateX(-50%) rotate(30deg)"></i><i class="tick" style="transform:translateX(-50%) rotate(60deg)"></i><i class="tick" style="transform:translateX(-50%) rotate(90deg)"></i><i class="tick" style="transform:translateX(-50%) rotate(120deg)"></i><i class="tick" style="transform:translateX(-50%) rotate(150deg)"></i><i class="tick" style="transform:translateX(-50%) rotate(180deg)"></i><i class="tick" style="transform:translateX(-50%) rotate(210deg)"></i><i class="tick" style="transform:translateX(-50%) rotate(240deg)"></i><i class="tick" style="transform:translateX(-50%) rotate(270deg)"></i><i class="tick" style="transform:translateX(-50%) rotate(300deg)"></i><i class="tick" style="transform:translateX(-50%) rotate(330deg)"></i><i class="hand hour" id="hourHand"></i><i class="hand minute" id="minuteHand"></i><i class="hand second" id="secondHand"></i><i class="center"></i><div class="clock-text"><div class="time" id="time">00:00</div><div class="date" id="date">----</div></div></div></div></section>
<footer class="bottom"><div class="hint">ご滞在をお楽しみください。<br>画面をタップすると操作できます。</div><nav class="dock" aria-label="エンターテインメント"><button data-url="https://www.youtube.com/" type="button">YouTube</button><button data-url="https://www.netflix.com/" type="button">Netflix</button><button data-url="https://www.spotify.com/" type="button">Music</button><button id="wallpaperBtn" type="button">壁紙</button></nav></footer>
</main>
<div class="sleep" id="sleep" role="button" tabindex="0">画面をタップして再開</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><section class="panel"><div class="panel-head"><h2 id="settingsTitle">お部屋の設定</h2><button class="close" id="closeBtn" aria-label="閉じる">×</button></div><div class="form-row"><label for="headlineInput">見出し</label><input id="headlineInput" type="text" maxlength="80"></div><div class="form-row"><label for="subtitleInput">サブタイトル</label><input id="subtitleInput" type="text" maxlength="160"></div><div class="form-row"><label for="customInput">カスタム壁紙URL（任意）</label><input id="customInput" type="url" inputmode="url" placeholder="https://example.com/image.jpg"></div><div class="form-row"><label>壁紙を選ぶ（25種類）</label><div class="wallpapers" id="wallpapers"></div></div><div class="panel-footer"><button class="secondary" id="resetBtn" type="button">初期設定に戻す</button><button class="save" id="saveBtn" type="button">保存する</button></div></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){'use strict';
var KEY='hotel-on-tv-v2', defaults={headline:'ゆっくりと、\nお過ごしください。',subtitle:'今日という一日の余白を、あなたのために。テレビでもスマートフォンでも、心地よい時間をお楽しみください。',wallpaper:0,custom:''};
var wallpapers=[
['Twilight','linear-gradient(135deg,#1d1234,#4d1d45 48%,#f19a67)'],['Ocean','linear-gradient(135deg,#071b37,#075985 50%,#5eead4)'],['Forest','linear-gradient(135deg,#0c241b,#14532d 50%,#84cc16)'],['Sand','linear-gradient(135deg,#6b4932,#c58b61 52%,#f1d7a7)'],['Midnight','linear-gradient(135deg,#020617,#111827 50%,#312e81)'],['Aurora','linear-gradient(135deg,#102a43,#146c78 45%,#a855f7)'],['Rose','linear-gradient(135deg,#3b102b,#9f3457 55%,#fda4af)'],['Cloud','linear-gradient(135deg,#526477,#a8c0d4 55%,#f1f5f9)'],['Cedar','linear-gradient(135deg,#26140e,#713f12 55%,#d97706)'],['Sakura','linear-gradient(135deg,#3b1d32,#a75570 50%,#fbcfe8)'],['Rain','linear-gradient(135deg,#17202c,#34495e 50%,#8da9c4)'],['Lounge','linear-gradient(135deg,#211b16,#4a3522 50%,#b47b47)'],['Lakeside','linear-gradient(135deg,#082f49,#0369a1 50%,#bae6fd)'],['Moss','linear-gradient(135deg,#172b1b,#365314 50%,#a3a34b)'],['Velvet','linear-gradient(135deg,#190b19,#581c35 50%,#c0266e)'],['Dawn','linear-gradient(135deg,#7c2d12,#f97316 50%,#fde68a)'],['Alpine','linear-gradient(135deg,#172554,#1d4ed8 50%,#bfdbfe)'],['Ink','linear-gradient(135deg,#030712,#111827 50%,#374151)'],['Cobalt','linear-gradient(135deg,#0c1e4b,#1e40af 50%,#38bdf8)'],['Lavender','linear-gradient(135deg,#312e81,#7c3aed 50%,#ddd6fe)'],['Ember','linear-gradient(135deg,#29120b,#9a3412 50%,#facc15)'],['Tea','linear-gradient(135deg,#292117,#695d46 50%,#d6b98c)'],['Tide','linear-gradient(135deg,#042f2e,#0f766e 50%,#99f6e4)'],['Charcoal','linear-gradient(135deg,#111,#292524 50%,#78716c)'],['Pearl','linear-gradient(135deg,#334155,#94a3b8 50%,#f8fafc)']
];
var $=function(id){return document.getElementById(id)}, state=load(), timer=0, idleTimer=0, lastMinute=-1;
function load(){try{var raw=localStorage.getItem(KEY);if(raw){var x=JSON.parse(raw);return {headline:typeof x.headline==='string'?x.headline:defaults.headline,subtitle:typeof x.subtitle==='string'?x.subtitle:defaults.subtitle,wallpaper:Number.isInteger(x.wallpaper)&&x.wallpaper>=0&&x.wallpaper<wallpapers.length?x.wallpaper:0,custom:typeof x.custom==='string'?x.custom:''};}}catch(e){}return {headline:defaults.headline,subtitle:defaults.subtitle,wallpaper:0,custom:''}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function renderText(){$('headline').innerHTML=escapeHTML(state.headline).replace(/\n/g,'<br>');$('subtitle').textContent=state.subtitle}
function escapeHTML(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function applyWallpaper(){var bg=state.custom?'url("'+state.custom.replace(/"/g,'%22')+'")':wallpapers[state.wallpaper][1];$('app').style.setProperty('--wallpaper',bg);document.querySelectorAll('.wallpaper').forEach(function(el,i){el.className='wallpaper'+(i===state.wallpaper&&!state.custom?' selected':'')})}
function updateClock(){var d=new Date(),sec=d.getSeconds()+d.getMilliseconds()/1000,min=d.getMinutes()+sec/60,hr=(d.getHours()%12)+min/60;$('secondHand').style.transform='translateX(-50%) rotate('+(sec*6)+'deg)';$('minuteHand').style.transform='translateX(-50%) rotate('+(min*6)+'deg)';$('hourHand').style.transform='translateX(-50%) rotate('+(hr*30)+'deg)';if(d.getMinutes()!==lastMinute){lastMinute=d.getMinutes();$('time').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);$('date').textContent=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}}
function scheduleClock(){updateClock();var now=Date.now(),delay=1000-(now%1000)+8;timer=setTimeout(scheduleClock,delay)}
function showToast(msg){var t=$('toast');t.textContent=msg;t.className='toast show';clearTimeout(showToast.t);showToast.t=setTimeout(function(){t.className='toast'},2200)}
function openModal(){ $('headlineInput').value=state.headline;$('subtitleInput').value=state.subtitle;$('customInput').value=state.custom;$('modal').className='modal open';$('headlineInput').focus() }
function closeModal(){$('modal').className='modal'}
function resetIdle(){clearTimeout(idleTimer);idleTimer=setTimeout(function(){$('sleep').className='sleep show'},15*60*1000)}
function validateCustom(value,done){if(!value){done('');return}try{var u=new URL(value);if(u.protocol!=='http:'&&u.protocol!=='https:')throw Error();var img=new Image();img.onload=function(){done(value)};img.onerror=function(){done(null)};img.src=value}catch(e){done(null)}}
function initWallpapers(){var box=$('wallpapers');wallpapers.forEach(function(w,i){var b=document.createElement('button');b.type='button';b.className='wallpaper';b.style.setProperty('--w',w[1]);b.innerHTML='<span>'+w[0]+'</span>';b.addEventListener('click',function(){state.wallpaper=i;state.custom='';applyWallpaper()});box.appendChild(b)})}
$('settingsBtn').addEventListener('click',openModal);$('wallpaperBtn').addEventListener('click',openModal);$('closeBtn').addEventListener('click',closeModal);$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal()});$('saveBtn').addEventListener('click',function(){var c=$('customInput').value.trim();validateCustom(c,function(result){if(result===null){showToast('壁紙URLを読み込めませんでした');return}state.headline=$('headlineInput').value.trim()||defaults.headline;state.subtitle=$('subtitleInput').value.trim()||defaults.subtitle;state.custom=result;renderText();applyWallpaper();save();closeModal();showToast('設定を保存しました')})});$('resetBtn').addEventListener('click',function(){state={headline:defaults.headline,subtitle:defaults.subtitle,wallpaper:0,custom:''};renderText();applyWallpaper();save();showToast('初期設定に戻しました')});$('sleepBtn').addEventListener('click',function(){$('sleep').className='sleep show'});$('sleep').addEventListener('click',function(){$('sleep').className='sleep';resetIdle()});$('sleep').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('sleep').className='sleep';resetIdle()}});document.querySelectorAll('[data-url]').forEach(function(b){b.addEventListener('click',function(){window.open(b.getAttribute('data-url'),'_blank','noopener,noreferrer')})});['click','keydown','touchstart','mousemove'].forEach(function(ev){document.addEventListener(ev,resetIdle,{passive:true})});initWallpapers();renderText();applyWallpaper();scheduleClock();resetIdle();
})();
</script>
</body></html>
